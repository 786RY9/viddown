[package]
name = "viddown"
version = "0.1.0"
description = "viddown desktop: Tauri shell running yt-dlp + ffmpeg locally"
authors = ["RY9"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "viddown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time", "fs"] }
# Same versions/features tauri-plugin-updater uses, so they compile only once.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Small installer: optimise for size, strip symbols.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
