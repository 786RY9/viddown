[project]
name = "viddown-server"
dynamic = ["version"]
description = "viddown cloud coordinator: manifest, cloud-fallback streaming, contact form, anonymous counters"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Keep in sync with requirements.txt (what deploy/update.sh installs into a slot).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp[default,curl-cffi]",  # deliberately unpinned: update.sh installs the latest and smoke-tests it
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
viddown-server = "viddown_server.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "viddown_server/__init__.py"

[tool.hatch.build.targets.wheel]
# viddown_core is copied in from ../cli by scripts/vendor_core.py before a build.
packages = ["viddown_server", "viddown_core"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
    "linux: needs Linux (FIFOs, process groups); run via Dockerfile.test",
    "network: needs internet access (real yt-dlp extraction)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "viddown_core.*"  # vendored from cli/, typed loosely there
ignore_errors = true
